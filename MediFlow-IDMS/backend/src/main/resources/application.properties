spring.application.name=mediflow-api
server.port=${SERVER_PORT:8081}

# Database credentials must be supplied by the deployment environment.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/dispensa?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Africa/Dar_es_Salaam}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=Africa/Dar_es_Salaam

# Never commit a signing secret. Set APP_JWT_SECRET to a random value of 32+ characters.
app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:30}

# Bootstrap is disabled by default. Enable only temporarily to create the first administrator.
app.bootstrap.enabled=${APP_BOOTSTRAP_ENABLED:false}
app.bootstrap.username=${APP_BOOTSTRAP_USERNAME:admin}
app.bootstrap.password=${APP_BOOTSTRAP_PASSWORD:}
app.bootstrap.full-name=${APP_BOOTSTRAP_FULL_NAME:MediFlow Administrator}

server.error.include-message=never
logging.level.org.springframework.security=WARN
logging.level.tz.mediflow.security=WARN

# Comma-separated exact frontend origins; configure the deployed frontend URL here.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174}
